services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retail_ww
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail_ww"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://retail:${POSTGRES_PASSWORD:-local_development_only}@db:5432/retail_ww
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      SEED_SAMPLE: ${SEED_SAMPLE:-true}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pg_data:
